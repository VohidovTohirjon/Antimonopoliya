services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: raqobat
      POSTGRES_USER: raqobat
      POSTGRES_PASSWORD: raqobat
    ports:
      - "5432:5432"
    volumes:
      - raqobat_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raqobat -d raqobat"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  raqobat_pgdata:

