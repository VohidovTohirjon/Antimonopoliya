# Single-VM deployment. Nginx is the only published service; PostgreSQL, the
# backend and vLLM stay on the internal network or on the host loopback.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-raqobat}
      POSTGRES_USER: ${POSTGRES_USER:-raqobat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env da belgilanishi shart}
    # Deliberately not published to the host: only the compose network reaches it.
    expose:
      - "5432"
    volumes:
      - raqobat_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-raqobat} -d ${POSTGRES_DB:-raqobat}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-raqobat}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-raqobat}
      DATA_DIR: /app/data
      # vLLM runs as a host systemd unit; reach it over the host gateway.
      LOCAL_LLM_BASE_URL: ${LOCAL_LLM_BASE_URL:-http://host.docker.internal:8001/v1}
      HF_HOME: /app/hf-cache
    expose:
      - "8000"
    volumes:
      - raqobat_data:/app/data
      - raqobat_hf:/app/hf-cache
      # Official legal corpus, imported by scripts/import_nhh.py. Read-only.
      - ./legal-corpus:/app/legal-corpus:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=5).status==200 else 1)\""]
      interval: 15s
      timeout: 10s
      retries: 10
      # BGE-M3 downloads and loads on first boot.
      start_period: 300s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  raqobat_pgdata:
  raqobat_data:
  raqobat_hf:
